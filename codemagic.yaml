workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Set Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Release APK
        script: |
          gradle assembleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
